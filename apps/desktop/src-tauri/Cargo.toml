[package]
name = "lke-desktop"
version = "0.1.0"
description = "Lorethra desktop shell"
authors = ["Lorethra Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
