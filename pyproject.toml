[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "living-knowledge-engine"
version = "0.1.0"
description = "Local-first knowledge, memory, narrative, and scenario engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
]

[project.scripts]
lke-api = "lke.api.app:main"

[project.optional-dependencies]
documents = ["docling>=2,<3"]
test = []

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

